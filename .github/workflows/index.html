<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Year Progress</title>
<style>
  :root {
    color-scheme: dark;
    --red: #e11d48;
    --red-deep: #7f1022;
    --blue: #3b82f6;
    --blue-glow: #60a5fa;
    --empty: #141a33;
    --card: #0b0710;
    --border: #2a1530;
    --text: #f1e9f5;
    --muted: #8b7f9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #191919;
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    color: var(--text);
  }
  .card {
    background: none;
    border: none;
    border-radius: 0;
    padding: 22px 24px 18px;
    max-width: 560px;
    margin: 8px auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(21, 1fr);
    gap: 7px;
  }
  .dot {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--empty);
  }
  .dot.done {
    background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
  }
  .dot.today {
    background: var(--blue);
    box-shadow: 0 0 0 2px rgba(96,165,250,.25), 0 0 10px 2px var(--blue-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(96,165,250,.25), 0 0 8px 1px var(--blue-glow); }
    50%      { transform: scale(1.18); box-shadow: 0 0 0 4px rgba(96,165,250,.15), 0 0 16px 4px var(--blue-glow); }
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 18px;
    font-size: 15px;
    font-weight: 600;
  }
  .footer .year { color: var(--text); letter-spacing: .5px; }
  .footer .left { color: var(--blue-glow); }
  .footer .left span { color: var(--muted); font-weight: 500; margin-left: 8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid" id="grid"></div>
    <div class="footer">
      <div class="year" id="year"></div>
      <div class="left"><b id="left"></b><span id="pct"></span></div>
    </div>
  </div>

<script>
  function render() {
    var now = new Date();
    var year = now.getFullYear();
    var isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    var total = isLeap ? 366 : 365;

    // Day of year using local calendar date (safe across daylight saving)
    var dayOfYear = Math.round(
      (Date.UTC(year, now.getMonth(), now.getDate()) - Date.UTC(year, 0, 1)) / 86400000
    ) + 1;

    var grid = document.getElementById("grid");
    var html = "";
    for (var i = 1; i <= total; i++) {
      var cls = "dot";
      if (i < dayOfYear) cls += " done";
      else if (i === dayOfYear) cls += " today";
      html += '<div class="' + cls + '"></div>';
    }
    grid.innerHTML = html;

    var left = total - dayOfYear;
    document.getElementById("year").textContent = year;
    document.getElementById("left").textContent = left + (left === 1 ? " day left" : " days left");
    document.getElementById("pct").textContent = Math.round((dayOfYear / total) * 100) + "%";
  }

  render();
  // Re-check every minute so it rolls over at midnight and into the new year by itself
  setInterval(render, 60000);
</script>
</body>
</html>
